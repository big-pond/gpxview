<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OpenLayers GPX Map</title>
    <link rel="stylesheet" href="ol_lib/ol.css" type="text/css">
    <script src="ol_lib/ol.js"></script>
    <style>
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #f0f0f0;
        }
        #error-overlay {
            position: absolute; top: 10px; left: 10px; background: rgba(255,0,0,0.8);
            color: white; padding: 10px; border-radius: 5px; font-family: sans-serif;
            display: none; z-index: 1000; max-width: 80%;
        }


    </style>
</head>
<body>
    <div id="error-overlay"></div>
    <div id="map"></div>

<script>
    function showError(msg) {
        const overlay = document.getElementById('error-overlay');
        overlay.innerText = msg;
        overlay.style.display = 'block';
        console.error(msg);
    }

    let map, gpxLayer, markerLayer, waypointLayer;
    let movableMarkerSource, movableMarkerLayer;

    try {
        if (typeof ol === 'undefined') {
            throw new Error("Библиотека OpenLayers (ol.js) не загружена или пуста!");
        }

        // Создаем элемент управления "Масштабная линейка"
        const scaleControl = new ol.control.ScaleLine({
            units: 'metric',
            bar: true,
            steps: 4,
            text: true
        });

        // Инициализация карты с maxZoom: 21
        map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                })
            ],
            controls: ol.control.defaults.defaults().extend([scaleControl]),
            view: new ol.View({
                center: ol.proj.fromLonLat([37.6173, 55.7558]),
                zoom: 4,
                maxZoom: 21
            })
        });

        movableMarkerSource = new ol.source.Vector();
        movableMarkerLayer = new ol.layer.Vector({
            source: movableMarkerSource,
            style: new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 7,
                    fill: new ol.style.Fill({ color: '#ffaa00' }),
                    stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
                })
            })
        });
        map.addLayer(movableMarkerLayer);

        console.log("Карта успешно инициализирована.");
    } catch (e) {
        showError("Ошибка инициализации карты: " + e.message);
    }

    function loadGpx(gpxContent) {
        try {
            if (!map) return;

            // Очищаем старые слои
            if (gpxLayer) map.removeLayer(gpxLayer);
            if (markerLayer) map.removeLayer(markerLayer);
            if (waypointLayer) map.removeLayer(waypointLayer);

            if (!ol.format || !ol.format.GPX) {
                throw new Error("В файле ol.js отсутствует поддержка формата GPX (ol.format.GPX).");
            }

            const gpxFormat = new ol.format.GPX();

            // 1. Читаем треки (LineString / MultiLineString)
            const trackFeatures = gpxFormat.readFeatures(gpxContent, {
                featureProjection: 'EPSG:3857'
            });

            const vectorSource = new ol.source.Vector({
                features: trackFeatures
            });

            const trackStyle = new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: '#ff3333',
                    width: 4
                })
            });

            gpxLayer = new ol.layer.Vector({
                source: vectorSource,
                style: trackStyle
            });
            map.addLayer(gpxLayer);

// 2. Читаем waypoint-точки отдельно
const waypointFeatures = gpxFormat.readFeatures(gpxContent, {
    featureProjection: 'EPSG:3857'
}).filter(f => {
    const geom = f.getGeometry();
    return geom && geom.getType() === 'Point';
});

if (waypointFeatures.length > 0) {
    const waypointSource = new ol.source.Vector({
        features: waypointFeatures
    });

    // SVG-булавка (pin) — синяя с белой обводкой и внутренним кругом
    const pinSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="22" viewBox="0 0 32 44">
            <path d="M16 0C7.2 0 0 7.2 0 16c0 11.2 16 28 16 28s16-16.8 16-28C32 7.2 24.8 0 16 0z"
                  fill="#0066ff" stroke="#ffffff" stroke-width="2"/>
            <circle cx="16" cy="16" r="6" fill="#ffffff"/>
        </svg>`;

    const pinSrc = 'data:image/svg+xml;utf8,' + encodeURIComponent(pinSvg);

    // Стиль булавки: anchor внизу по центру (острие булавки указывает на точку)
    const pinStyle = new ol.style.Style({
        image: new ol.style.Icon({
            anchor: [0.5, 1],
            anchorXUnits: 'fraction',
            anchorYUnits: 'fraction',
            src: pinSrc,
            scale: 1.0
        })
    });

    // Стиль булавки с подписью (если у waypoint-а есть name)
    function makePinWithLabelStyle(name) {
        return new ol.style.Style({
            image: new ol.style.Icon({
                anchor: [0.5, 1],
                anchorXUnits: 'fraction',
                anchorYUnits: 'fraction',
                src: pinSrc,
                scale: 1.0
            }),
            text: new ol.style.Text({
                text: name,
                offsetY: -23,          // поднимаем подпись над булавкой
                font: '12px sans-serif',
                fill: new ol.style.Fill({ color: '#000000' }),
                stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 })
            })
        });
    }

    waypointFeatures.forEach(f => {
        const name = f.get('name');
        f.setStyle(name ? makePinWithLabelStyle(name) : pinStyle);
    });

    waypointLayer = new ol.layer.Vector({
        source: waypointSource
    });
    map.addLayer(waypointLayer);
}
            // 3. Логика поиска первой и последней точек трека для маркеров
            let startCoords = null;
            let endCoords = null;

            trackFeatures.forEach(feature => {
                const geom = feature.getGeometry();
                if (!geom) return;

                const type = geom.getType();

                if (type === 'LineString') {
                    const coords = geom.getCoordinates();
                    if (coords && coords.length > 0) {
                        if (!startCoords) startCoords = coords[0];
                        endCoords = coords[coords.length - 1];
                    }
                } else if (type === 'MultiLineString') {
                    const lines = geom.getLineStrings();
                    if (lines && lines.length > 0) {
                        const firstLineCoords = lines[0].getCoordinates();
                        const lastLineCoords = lines[lines.length - 1].getCoordinates();

                        if (!startCoords && firstLineCoords.length > 0) {
                            startCoords = firstLineCoords[0];
                        }
                        if (lastLineCoords.length > 0) {
                            endCoords = lastLineCoords[lastLineCoords.length - 1];
                        }
                    }
                }
            });

            if (startCoords && endCoords) {
                const markerSource = new ol.source.Vector();

                const startFeature = new ol.Feature({
                    geometry: new ol.geom.Point(startCoords)
                });
                startFeature.setStyle(new ol.style.Style({
                    image: new ol.style.Icon({
                        anchor: [0, 1],
                        src: 'start.png',
                        scale: 1.0
                    })
                }));

                const endFeature = new ol.Feature({
                    geometry: new ol.geom.Point(endCoords)
                });
                endFeature.setStyle(new ol.style.Style({
                    image: new ol.style.Icon({
                        anchor: [0, 1],
                        src: 'finish.png',
                        scale: 1.0
                    })
                }));

                markerSource.addFeatures([startFeature, endFeature]);

                markerLayer = new ol.layer.Vector({
                    source: markerSource
                });
                map.addLayer(markerLayer);
            }

            // 4. Центрируем карту по границам трека и waypoint-ов
            let extent = vectorSource.getExtent();

            if (waypointFeatures.length > 0) {
                const waypointSource = waypointLayer.getSource();
                const waypointExtent = waypointSource.getExtent();
                extent = ol.extent.extend(extent, waypointExtent);
            }

            if (extent && !ol.extent.isEmpty(extent)) {
                map.getView().fit(extent, {
                    padding: [40, 40, 40, 40],
                    duration: 500,
                    maxZoom: 21
                });
            }

            document.getElementById('error-overlay').style.display = 'none';

            if (trackFeatures.length === 0 && waypointFeatures.length === 0) {
                showError("В GPX-файле не найдено точек или треков.");
            }

        } catch (e) {
            showError("Ошибка обработки GPX: " + e.message);
        }
    }

    // Функция перемещения маркера из Python
    function showMarkerAt(lon, lat) {
        movableMarkerSource.clear();
        if (lon === null || lat === null) return;

        const position = ol.proj.fromLonLat([lon, lat]);
        const markerFeature = new ol.Feature({
            geometry: new ol.geom.Point(position)
        });
        movableMarkerSource.addFeature(markerFeature);
    }
</script>
</body>
</html>
